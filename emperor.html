const Portrait = (function() {
  const SKIN = ['#faf0e6','#f5e1d0','#fce8d5','#f8e0cc','#fde6d4','#f0d8c8','#fce0d0','#f7dcc8'];

  const FLOWER = ['#ffb0c0','#ff90b0','#ffc0d0','#e080a0','#ffa0b8','#f090b0','#ffd0d8','#e87090'];
  const CHAIN = ['#ffd700','#f0c040','#e8b030','#ffc040'];
  const LIPS = ['#c41e3a','#b03060','#d45060','#a02040','#cc4050','#c03050','#d04060','#b03048'];
  const EYE_COLORS = ['#2a1a0a','#1e1210','#3a2010','#1a1008'];
  function h(s){let v=0;for(let i=0;i<s.length;i++)v=((v<<5)-v)+s.charCodeAt(i)|0;return Math.abs(v);}
  function hr(s,a){return a[h(s)%a.length];}
  function hs(s,m){return h(s)%m;}
  function generate(seed){
    const hs2=typeof seed==='string'?seed:''+(Math.random()*1e6|0);

    const lc=hr(hs2,LIPS),ec=hr(hs2,EYE_COLORS);
    const hasFlower=hs(hs2+'f',3)>0,hasChain=hs(hs2+'c',4)>0,hasEarring=hs(hs2+'e',2)>0;
    let body=`<rect x="5" y="78" width="90" height="42" rx="3" fill="${dc.d}"/><path d="M8 78 Q50 92 92 78 L92 120 L8 120Z" fill="${dc.m}"/><path d="M38 78 L50 96 L62 78" fill="none" stroke="${dc.a}" stroke-width="1.2" opacity="0.5"/><path d="M20 78 Q50 88 80 78" fill="none" stroke="${dc.a}" stroke-width="0.8" opacity="0.35"/><circle cx="38" cy="88" r="1.2" fill="${dc.e}" opacity="0.5"/><circle cx="50" cy="85" r="1.2" fill="${dc.e}" opacity="0.5"/><circle cx="62" cy="88" r="1.2" fill="${dc.e}" opacity="0.5"/>`;
    let hair='';
    if(hs_style==='elegant'){hair=`<ellipse cx="50" cy="26" rx="30" ry="30" fill="${hc}"/><rect x="22" y="26" width="56" height="52" rx="2" fill="${hc}"/><rect x="25" y="24" width="50" height="3" rx="1.5" fill="${hc}"/><path d="M22 40 Q18 60 24 90" fill="${hc}" opacity="0.7"/><path d="M78 40 Q82 60 76 90" fill="${hc}" opacity="0.7"/>`;}
    else if(hs_style==='bun'){hair=`<ellipse cx="50" cy="24" rx="28" ry="28" fill="${hc}"/><circle cx="50" cy="6" r="14" fill="${hc}"/><rect x="24" y="26" width="52" height="52" rx="2" fill="${hc}"/><path d="M24 40 Q20 60 26 88" fill="${hc}" opacity="0.7"/><path d="M76 40 Q80 60 74 88" fill="${hc}" opacity="0.7"/>`;}
    else if(hs_style==='halfUp'){hair=`<ellipse cx="50" cy="28" rx="30" ry="30" fill="${hc}"/><ellipse cx="50" cy="10" rx="18" ry="10" fill="${hc}"/><rect x="22" y="28" width="56" height="50" rx="2" fill="${hc}"/><path d="M22 42 Q18 65 24 95" fill="${hc}" opacity="0.7"/><path d="M78 42 Q82 65 76 95" fill="${hc}" opacity="0.7"/>`;}
    else{hair=`<ellipse cx="50" cy="28" rx="30" ry="30" fill="${hc}"/><rect x="22" y="28" width="56" height="50" rx="2" fill="${hc}"/><path d="M22 38 Q16 65 22 100" fill="${hc}" opacity="0.7"/><path d="M78 38 Q84 65 78 100" fill="${hc}" opacity="0.7"/><path d="M70 38 Q80 60 76 85" fill="${hc}" opacity="0.5"/>`;}
    let acc='';
    if(hasFlower){const fx=hs(hs2+'fx',2)===0?26:68;acc+=`<ellipse cx="${fx}" cy="14" rx="10" ry="8" fill="${fc}" opacity="0.85"/><ellipse cx="${fx-4}" cy="12" rx="4" ry="3.5" fill="${fc}" opacity="0.7"/><ellipse cx="${fx+4}" cy="12" rx="4" ry="3.5" fill="${fc}" opacity="0.7"/><ellipse cx="${fx}" cy="10" rx="4" ry="3.5" fill="${fc}" opacity="0.7"/><ellipse cx="${fx}" cy="18" rx="4" ry="3.5" fill="${fc}" opacity="0.7"/><circle cx="${fx}" cy="14" r="2" fill="${dc.e}" opacity="0.6"/>`;}
    if(hasChain){acc+=`<path d="M42 4 Q46 8 50 6 Q54 8 58 4" fill="none" stroke="${cc}" stroke-width="0.6" opacity="0.6"/><circle cx="50" cy="12" r="1.5" fill="${fc}" opacity="0.7"/>`;}
    if(hasEarring){acc+=`<circle cx="34" cy="52" r="1.5" fill="${cc}" opacity="0.6"/><line x1="34" y1="53" x2="33" y2="58" stroke="${cc}" stroke-width="0.4" opacity="0.4"/><circle cx="33" cy="59" r="1" fill="${fc}" opacity="0.5"/>`;}
    const brows=`<path d="M36 39 Q42 36 48 38" fill="none" stroke="${hc}" stroke-width="1.3" opacity="0.6"/><path d="M52 38 Q58 36 64 39" fill="none" stroke="${hc}" stroke-width="1.3" opacity="0.6"/>`;
    const eyes=`<ellipse cx="42" cy="46" rx="6" ry="4" fill="white" opacity="0.95"/><ellipse cx="42" cy="46" rx="5.5" ry="3.8" fill="white"/><ellipse cx="42" cy="46.5" rx="3" ry="3" fill="${ec}"/><circle cx="42" cy="46.5" r="1.8" fill="#0a0604"/><circle cx="40.5" cy="45" r="0.9" fill="white" opacity="0.9"/><circle cx="43" cy="47" r="0.4" fill="white" opacity="0.5"/><path d="M36 44 Q42 41 48 44" fill="none" stroke="${hc}" stroke-width="1" opacity="0.6"/><ellipse cx="42" cy="43" rx="5" ry="1.5" fill="${dc.a}" opacity="0.1"/><ellipse cx="58" cy="46" rx="6" ry="4" fill="white" opacity="0.95"/><ellipse cx="58" cy="46" rx="5.5" ry="3.8" fill="white"/><ellipse cx="58" cy="46.5" rx="3" ry="3" fill="${ec}"/><circle cx="58" cy="46.5" r="1.8" fill="#0a0604"/><circle cx="56.5" cy="45" r="0.9" fill="white" opacity="0.9"/><circle cx="59" cy="47" r="0.4" fill="white" opacity="0.5"/><path d="M52 44 Q58 41 64 44" fill="none" stroke="${hc}" stroke-width="1" opacity="0.6"/><ellipse cx="58" cy="43" rx="5" ry="1.5" fill="${dc.a}" opacity="0.1"/>`;
    const nose=`<path d="M49 50 Q50 52 51 50" fill="none" stroke="${sk}" stroke-width="0.6" opacity="0.4"/>`;
    const mouth=`<ellipse cx="50" cy="57" rx="5.5" ry="2.8" fill="${lc}" opacity="0.85"/><ellipse cx="50" cy="56.5" rx="4" ry="1.5" fill="${lc}" opacity="0.3"/><path d="M45 57 Q50 60 55 57" fill="none" stroke="${lc}" stroke-width="0.5" opacity="0.4"/>`;
    const blush=`<ellipse cx="35" cy="53" rx="5" ry="2.5" fill="#ff9999" opacity="0.12"/><ellipse cx="65" cy="53" rx="5" ry="2.5" fill="#ff9999" opacity="0.12"/>`;
    const neck=`<path d="M42 58 Q50 70 58 58" fill="none" stroke="${cc}" stroke-width="0.7" opacity="0.5"/><circle cx="50" cy="70" r="1.5" fill="${dc.e}" opacity="0.5"/>`;
    return `<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g_${hs2.slice(0,6)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fce0d0"/><stop offset="100%" stop-color="#f5d0b8"/></linearGradient></defs><rect width="100" height="120" fill="url(#g_${hs2.slice(0,6)})"/>${body}<path d="M42 58 L42 72 Q50 76 58 72 L58 58" fill="${sk}"/><path d="M38 58 Q30 54 26 60 L38 66Z" fill="${sk}" opacity="0.5"/><path d="M62 58 Q70 54 74 60 L62 66Z" fill="${sk}" opacity="0.5"/>${hair}${acc}${brows}${eyes}${nose}${blush}${mouth}${neck}</svg>`;

  function desc(v,m){for(const k of Object.keys(m).map(Number).sort((a,b)=>b-a))if(v>=k)return m[k];return m[0];}
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function ri(r){return RANKS.indexOf(r);}
  function ru(r){const i=ri(r);return i>0?RANKS[i-1]:r;}
  function rd(r){const i=ri(r);return i<RANKS.length-1?RANKS[i+1]:r;}
  function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function pickFamily(){const pool=[];FAMILY_TIERS.forEach(f=>{for(let i=0;i<f.weight;i++)pool.push(f);});return pick(pool);}

  let state = {dynasty:'',treasury:0,year:1,month:1,actionsLeft:5,concubines:[],coldPalaceList:[],banned:{},eventLog:[],pendingEvent:null,eventTriggerRate:60,nextDraftIn:3};

  function genConcubine(draft) {
    const s=pick(SURS); let n=pick(NAMES);
    while(state.concubines.some(c=>c.name===s+n))n=pick(NAMES);
    const fam=pickFamily();
    return {id:genId(),name:s+n,beauty:rand(40,95),favor:draft?rand(20,50):rand(30,60),talent:rand(20,85),wisdom:rand(20,80),trait:pick(TRAITS),personality:pick(PERSONALITIES),family:fam,rank:draft?fam.initRank:'官女子',health:draft?rand(70,100):rand(60,90),pregnant:false,pregMonth:0,portraitSeed:Math.random().toString(36).slice(2)};
  }

  function save(){try{localStorage.setItem('emperor_game',JSON.stringify(state));}catch(e){}}
  function load(){
    try{const d=localStorage.getItem('emperor_game');if(d){state=JSON.parse(d);if(!state.coldPalaceList&&state.coldPalace)state.coldPalaceList=state.coldPalace;if(state.eventTriggerRate===undefined||state.eventTriggerRate<10)state.eventTriggerRate=60;if(state.nextDraftIn===undefined||state.nextDraftIn>10)state.nextDraftIn=1;if(!state.banned)state.banned={};if(!state.eventLog)state.eventLog=[];if(state.pendingEvent)state.pendingEvent=null;if(state.year===undefined)state.year=1;state.concubines.forEach(c=>{if(c.health===undefined)c.health=rand(60,100);if(!c.personality)c.personality=pick(PERSONALITIES);if(!c.family)c.family=pickFamily();if(c.rank==='答应'&&c.family&&c.family.initRank)c.rank=c.family.initRank;if(c.pregnant===undefined){c.pregnant=false;c.pregMonth=0;}});state.coldPalaceList.forEach(c=>{if(c.health===undefined)c.health=rand(20,60);if(!c.personality)c.personality=pick(PERSONALITIES);if(!c.family)c.family=pickFamily();if(c.pregnant===undefined){c.pregnant=false;c.pregMonth=0;}});return true;}}catch(e){}return false;
  }

  function portraitSVG(seed, w, h) {
    return `<div style="width:${w}px;height:${h}px;overflow:hidden;border-radius:${w<100?8:12}px;border:1px solid rgba(139,105,20,0.25);background:linear-gradient(180deg,#fce0d0,#f5d0b8);flex-shrink:0;">${Portrait.generate(seed)}</div>`;
  }

  function updateUI() {
    document.getElementById('main-dynasty').textContent = state.dynasty;
    document.getElementById('main-year').textContent = state.dynasty+state.year+'年';
    document.getElementById('main-month').textContent = '第'+state.month+'月';
    document.getElementById('main-treasury').textContent = state.treasury;
    const pips = document.getElementById('main-actions'); pips.innerHTML='';
    for(let i=0;i<5;i++){const p=document.createElement('div');p.className='action-pip'+(i>=state.actionsLeft?' used':'');pips.appendChild(p);}
    const badge = document.getElementById('fab-cold-badge');
    if(state.coldPalaceList.length>0){badge.style.display='flex';badge.textContent=state.coldPalaceList.length;}else{badge.style.display='none';}
    const pregCount=state.concubines.filter(c=>c.pregnant).length;
    document.getElementById('pregnancy-alert').style.display=pregCount>0?'block':'none';
    document.getElementById('palace-alert').style.display=state.pendingEvent?'block':'none';
    const btn=document.getElementById('next-month-btn'); if(btn)btn.classList.toggle('urgent',state.actionsLeft<=0);
    // Draft countdown
    const draftLabel=document.getElementById('draft-countdown');
    if(draftLabel){
      if(state.nextDraftIn>0){
        draftLabel.innerHTML=`&#31168;&#36873;&#20498;&#35745;&#26376;: <b>${state.nextDraftIn}</b>`;
        draftLabel.style.display='block';
      } else {
        draftLabel.style.display='none';
      }
    }
    renderMainList();
  }

  function renderMainList() {
    const el = document.getElementById('main-concubine-list');
    if(state.concubines.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">&#127963;</div><div class="empty-text">&#21518;&#23467;&#31354;&#26080;&#19968;&#20154;</div><div class="empty-hint">&#31561;&#24453;&#36873;&#31168;&#25110;&#26032;&#20154;&#20837;&#23467;&#8230;&#8230;</div></div>';return;}
    const sorted=[...state.concubines].sort((a,b)=>ri(a.rank)-ri(b.rank));
    let html='';
    sorted.forEach(c=>{
      const rc=RC[c.rank]||'rank-low';
      const isBanned=state.banned[c.id];
      const hp=c.health>=70?'#4caf50':c.health>=40?'#ff9800':'#e55555';
      const displayName = c.title ? c.title + c.rank : c.name;
      html+=`<div class="concubine-card" onclick="Game.showDetail('${c.id}')">${portraitSVG(c.portraitSeed,80,100)}<div class="concubine-info"><div class="concubine-name">${displayName}<span class="concubine-rank ${rc}">${c.title?'':c.rank}</span>${isBanned?'<span class="badge badge-banned">&#31105;&#36275;</span>':''}</div><div class="concubine-stats"><span>&#23456;&#29233; <b>${c.favor}</b></span><span>&#32654;&#35980; <b>${c.beauty}</b></span><span>&#20581;&#24247; <b style="color:${hp}">${c.health}</b></span>${c.pregnant?'<span class="badge badge-pregnant">&#129324; &#26377;&#21916;<span class="badge-pregnant-month">'+c.pregMonth+'&#26376;</span></span>':''}</div></div></div>`;
    });
    el.innerHTML=html;
  }

  function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const pg=document.getElementById('page-'+name);if(pg)pg.classList.add('active');if(name==='main')updateUI();}

  function initStart(){
    if(load()&&state.dynasty&&state.concubines){
      processBannedDecay();
      save();
      showPage('main');
      updateUI();
      return;
    }
    showPage('start');

  function startNewGame(){
    const v=document.getElementById('dynasty-input').value.trim();
    if(!v){alert('请输入国号！');return;}
    state.dynasty=v;state.treasury=rand(3000,8000);
    document.getElementById('treasury-amount').textContent=state.treasury+' 两';
    var modal=document.getElementById('modal-treasury');
    if(!modal){alert('错误: 找不到modal元素');return;}
    modal.classList.add('show');

  function confirmTreasury(){
    // Reset all game state
    state.year=1;state.month=1;state.actionsLeft=5;
    state.concubines=[];state.coldPalaceList=[];state.banned={};
    state.eventLog=[];state.pendingEvent=null;
    state.eventTriggerRate=60;state.nextDraftIn=3;
    state._draftPool=[];state._draftSelectedIds=[];
    state._banquetSelected=null;
    document.getElementById('modal-treasury').classList.remove('show');
    save();showPage('main');updateUI();
    setTimeout(()=>triggerDraft(),800);
  }
  function processBannedDecay(){for(const id in state.banned){state.banned[id]--;if(state.banned[id]<=0)delete state.banned[id];}}
  function processColdDecay(){state.coldPalaceList=state.coldPalaceList.filter(c=>{c.health=clamp(c.health-10,0,100);if(c.health<=0){logEvent('&#30149;&#36893;&#33268;&#27515;',c.rank+c.name+'&#22312;&#20919;&#23467;&#20013;&#30149;&#36893;');showFeedback('<span class="neg">'+c.name+'</span> &#22312;&#20919;&#23467;&#20013;&#20581;&#24247;&#24402;&#38646;&#65292;&#30149;&#36893;');return false;}return true;});}

  function consumeAction(){state.actionsLeft--;if(state.actionsLeft<=0){setTimeout(()=>{if(!state.pendingEvent){showFeedback('&#26412;&#26376;&#34892;&#21160;&#24050;&#29992;&#23436;&#65292;&#33258;&#21160;&#36827;&#20837;&#19979;&#26376;&#65281;');setTimeout(()=>nextMonth(),1500);}},500);}else{setTimeout(()=>{if(state.concubines.length>=2&&!state.pendingEvent){triggerPalaceEvent();}},500);}}

  function nextMonth(){
    if(state.pendingEvent){showFeedback('&#35831;&#20808;&#22788;&#29702;&#21518;&#23467;&#24322;&#21160;&#20107;&#20214;&#65281;');return;}
    state.month++;if(state.month>12){state.month=1;state.year++;}
    state.treasury+=10000;state.actionsLeft=5;
    processBannedDecay();processColdDecay();processPregnancy();save();updateUI();
    triggerPalaceEvent();
    state.nextDraftIn--;
    if(state.nextDraftIn<=0){state.nextDraftIn=3;setTimeout(()=>triggerDraft(),300);}
  }

  function processPregnancy(){
    const births=[];
    state.concubines.forEach(c=>{
      if(!c.pregnant)return;
      c.pregMonth++;
      c.health=clamp(c.health-2,0,100);
      if(c.pregMonth>=10){
        const isBoy=Math.random()<0.5;
        births.push({concubine:c,childType:isBoy?'&#30343;&#23376;':'&#20844;&#20027;'});
        c.pregnant=false;c.pregMonth=0;
      }
    });
    if(births.length>0){setTimeout(()=>showBirthResult(births),300);}
  }

    const el=document.getElementById('birth-content');

    document.getElementById('modal-birth').classList.add('show');

  function showBirthResult(births){
    const el=document.getElementById('birth-content');
    let html='<div class="birth-result">';
    births.forEach(({concubine:c,childType})=>{
      const promoteCount=childType==='&#30343;&#23376;'?2:1;
      const oldRank=c.rank;
      if(c.rank!=='&#30343;&#21518;'){for(let i=0;i<promoteCount;i++){const newR=ru(c.rank);if(newR!==c.rank)c.rank=newR;}}
      c.favor=clamp(c.favor+20,0,100);c.health=clamp(c.health+10,0,100);
      const icon=childType==='&#30343;&#23376;'?'&#128118;':'&#128117;';
      html+=`<div class="birth-icon">${icon}</div><div class="baby-type">${c.name} &#35806;&#19979;${childType}&#65281;</div><div class="baby-info">${oldRank} ${c.name}&#65292;&#21313;&#26376;&#24576;&#32974;&#65292;&#19968;&#26397;&#20998;&#23081;<br>&#27597;&#23376;&#24179;&#23433;</div><div class="baby-promote">&#22240;&#35806;&#19979;${childType}&#65292;${c.name} &#26187;&#21319; ${promoteCount} &#32423;<br>${oldRank} &#8594; ${c.rank}</div>`;

    html+='<button class="btn-primary" onclick="Game.closeBirth()">&#22823;&#21916;&#65292;&#21516;&#24198;&#65281;</button></div>';

    logEvent('&#20998;&#23064;',births.map(({concubine:c,childType:t})=>c.name+'&#35806;&#19979;'+t).join('&#12289;'));
    save();updateUI();
  }

  function actionFavor(id){
    if(!canAct())return;const c=findC(id);if(!c)return;

    if(state.treasury<800){showFeedback('国库不足800两！');return;}
    state.treasury-=800;
    state.actionsLeft--;
    // Each concubine performs
    const results=state.concubines.map(c=>{
      const score=calcBanquetScore(c,prog);
      const p=BANQUET_PROGRAMS[prog];
      let traitMatch=false;
      p.traits.forEach(t=>{if(c.trait&&c.trait.indexOf(t)>=0)traitMatch=true;});
      return {concubine:c,score,prog,traitMatch};
    });
    results.sort((a,b)=>b.score-a.score);
    const champion=results[0];
    const oldRank=champion.concubine.rank;
    let promoted=false;
    if(champion.concubine.rank!=='皇后'){
      const newR=ru(champion.concubine.rank);
      if(newR!==champion.concubine.rank){champion.concubine.rank=newR;promoted=true;}
    }
    champion.concubine.favor=clamp(champion.concubine.favor+15,0,100);
    logEvent('宴会',`${champion.concubine.name}表演${champion.prog}，得分${champion.score}，获魁`);
    save();updateUI();
    // Show results
    let html='<div style="text-align:center;padding:8px;">';
    html+=`<div style="font-size:18px;color:#c49030;margin-bottom:4px;">&#127881; 宴会结束</div>`;
    html+=`<div style="font-size:12px;color:#8a7060;margin-bottom:12px;">表演内容：${prog} | 国库 -800两</div>`;
    html+='<div style="max-height:55vh;overflow-y:auto;margin-bottom:12px;">';
    results.forEach((r,i)=>{
      const isChampion=i===0;
      const medal=i===0?'&#127942;':i===1?'&#129352;':i===2?'&#129353;':`<span style="color:#b0a090;font-size:13px;">#${i+1}</span>`;
      const bg=isChampion?'rgba(200,160,80,0.15)':'rgba(255,245,230,0.4)';
      const borderColor=isChampion?'rgba(200,160,80,0.4)':'rgba(200,160,80,0.1)';
      const promoteNote=isChampion&&promoted?`<span style="color:#4a9a5a;font-size:11px;"> ${oldRank}→${r.concubine.rank}</span>`:'';
      const favorNote=isChampion?`<span style="color:#c49030;font-size:11px;"> +15宠爱</span>`:'';
      const traitNote=r.traitMatch?'<span style="color:#e89060;font-size:10px;"> 擅长</span>':'';
      const scoreColor=isChampion?'#c49030':r.score>=80?'#4a9a5a':r.score>=60?'#8a7060':'#b0a090';
      html+=`<div style="display:flex;align-items:center;padding:10px 12px;margin:4px 0;border-radius:10px;background:${bg};border:1px solid ${borderColor};">
        <div style="font-size:18px;min-width:36px;text-align:center;">${medal}</div>
        <div style="flex:1;text-align:left;padding:0 8px;">
          <div style="font-size:14px;font-weight:bold;color:${isChampion?'#c49030':'#5a3e28'};">${r.concubine.name}${traitNote}</div>
          <div style="font-size:11px;color:#8a7060;">${r.prog} | 得分 <b style="color:${scoreColor}">${r.score}</b>${favorNote}${promoteNote}</div>
        </div>
        <div style="font-size:20px;">${Portrait.generate(r.concubine.portraitSeed,30,38)}</div>
      </div>`;
    });
    html+='</div></div>';
    html+='<button class="btn-primary" style="margin:0;" onclick="Game.confirmBanquet()">确 认</button>';
    document.getElementById('banquet-content').innerHTML=html;
    // Trigger palace event for remaining actions
    setTimeout(()=>triggerPalaceEvent(),500);
  }

  function calcBanquetScore(c, prog){
    const p=BANQUET_PROGRAMS[prog];
    let score=p.base;
    const bonusVal=p.bonus==='talent'?c.talent:c.wisdom;
    score+=bonusVal*p.bonusWeight;
    let traitMatch=false;
    p.traits.forEach(t=>{
      if(c.trait&&c.trait.indexOf(t)>=0)traitMatch=true;
    });
    if(traitMatch)score+=15;
    score+=rand(-5,5);
    return Math.round(Math.max(20,score));
  }

  function generateEvent(){
    const con=[...state.concubines].sort(()=>Math.random()-0.5);
    if(con.length<2){
      if(con.length===0)return null;
      return genSingle(con[0]);
    }
    const r=Math.random();
    if(r<0.15){const pe=genPregnancyEvent();if(pe)return pe;}
    if(r<0.55)return genJealousy(con);
    if(r<0.8)return genFramed(con);
    return genRumor(con);
  }

  function showEventModal(){

    let html=`<div class="event-title">${ev.title}</div>`;

      html+=`<button class="event-option" id="event-opt-${i}" onclick="Game.selectEventOption(${i})">${opt.text}</button>`;
    });
    el.innerHTML=html;
    const btn=document.getElementById('event-confirm-btn');
    if(btn){btn.disabled=true;btn.style.opacity='0.5';}
    document.getElementById('modal-event').classList.add('show');

  function selectEventOption(idx){
    if(!state.pendingEvent)return;
    state._selectedEventOption=idx;
    const ev=state.pendingEvent;
    ev.options.forEach((_,i)=>{
      const optEl=document.getElementById('event-opt-'+i);
      if(optEl){
        if(i===idx){
          optEl.style.borderColor='rgba(200,160,80,0.6)';
          optEl.style.background='rgba(240,220,200,0.9)';
        } else {
          optEl.style.borderColor='rgba(200,160,80,0.25)';
          optEl.style.background='rgba(255,245,230,0.7)';
        }
      }
    });
    const btn=document.getElementById('event-confirm-btn');
    if(btn){btn.disabled=false;btn.style.opacity='1';}
  }

  function confirmEventOption(){
    if(state._selectedEventOption===null||!state.pendingEvent)return;
    const idx=state._selectedEventOption;
    const ev=state.pendingEvent;
    if(idx>=0&&idx<ev.options.length){ev.options[idx].effect();}
    state.pendingEvent=null;
    state._selectedEventOption=null;
    document.getElementById('modal-event').classList.remove('show');
    save();updateUI();
  }

  function handleEventOption(idx){
    selectEventOption(idx);
  }

  function openPendingEvent(){
    if(state.pendingEvent){showEventModal();}
    else{showFeedback('当前没有待处理事件。');}

  function logEvent(type,detail){
    state.eventLog.unshift({type,detail,month:state.month,year:state.year});
    if(state.eventLog.length>100) state.eventLog.pop();

  function triggerPalaceEvent(){
    if(state.concubines.length<2)return;

      state._draftPool.push(c);

  function toggleDraft(id){
    const idx=state._draftSelectedIds.indexOf(id);
    if(idx>=0){state._draftSelectedIds.splice(idx,1);}
    else{state._draftSelectedIds.push(id);}
    renderDraftSelection();

  function confirmDraft(){
    const selected=state._draftPool.filter(c=>state._draftSelectedIds.includes(c.id));
    if(selected.length===0){confirmDraftNone();return;}
    const names=selected.map(c=>{state.concubines.push(c);return c.name;}).join('、');

    state.coldPalaceList.forEach(c=>{
      const hp=c.health>=70?'#4caf50':c.health>=40?'#ff9800':'#e55555';
      html+=`<div style="display:flex;align-items:center;padding:10px;margin-bottom:10px;background:rgba(230,230,235,0.5);border:1px solid rgba(180,180,190,0.2);border-radius:12px;">
        <div style="flex-shrink:0;">${Portrait.generate(c.portraitSeed,70,88)}</div>
        <div style="flex:1;padding-left:12px;min-width:0;">
          <div style="font-size:15px;font-weight:bold;color:#c49030;margin-bottom:2px;">${c.name} <span style="font-size:11px;color:#a08060;font-weight:normal;">${c.rank}</span></div>
          <div style="font-size:11px;color:#8a7060;line-height:1.6;">
            宠爱 <b>${c.favor}</b> · 美貌 <b>${c.beauty}</b> · 才华 <b>${c.talent}</b> · 智慧 <b>${c.wisdom}</b><br>
            健康 <b style="color:${hp}">${c.health}</b>
          </div>
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:4px;">
          <button onclick="Game.actionColdRelease('${c.id}')" style="padding:5px 10px;border-radius:6px;border:1px solid rgba(80,180,100,0.4);background:rgba(80,180,100,0.15);color:#4a9a5a;font-size:11px;font-family:inherit;cursor:pointer;font-weight:bold;white-space:nowrap;">释放</button>
          <button onclick="Game.actionColdTorture('${c.id}')" style="padding:5px 10px;border-radius:6px;border:1px solid rgba(200,160,80,0.3);background:rgba(200,160,80,0.1);color:#8a7060;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;">折磨</button>
          <button onclick="Game.actionColdKill('${c.id}')" style="padding:5px 10px;border-radius:6px;border:1px solid rgba(200,60,60,0.3);background:rgba(200,60,60,0.1);color:#c04040;font-size:11px;font-family:inherit;cursor:pointer;font-weight:bold;white-space:nowrap;">赐死</button>
        </div>
      </div>`;
    });
    html+='</div>';
    document.getElementById('cold-palace-list').innerHTML=html;
    document.getElementById('cold-count').textContent=state.coldPalaceList.length;
    showPage('cold');
  }

  // ===== 怀孕名单 =====
  function showPregnantList(){
    const preg=state.concubines.filter(c=>c.pregnant);
    if(preg.length===0){showFeedback('目前没有妃嫔怀孕！');return;}
    let html='<div style="padding:8px;">';
    html+='<div style="text-align:center;font-size:14px;color:#d07090;margin-bottom:12px;">&#129324; 有喜妃嫔</div>';
    preg.forEach(c=>{
      const hpColor=c.health>=70?'#4caf50':c.health>=40?'#ff9800':'#e55555';
      html+=`<div class="morning-row">
        ${portraitSVG(c.portraitSeed,38,48)}
        <div class="morning-info">
          <div class="morning-name-row">${c.title?c.title+c.rank:c.name}<span class="morning-rank">${c.rank}</span></div>
          <div class="morning-greeting" style="color:#e06080;">&#129324; 怀孕 ${c.pregMonth}个月</div>
          <div class="morning-stats-row">
            <span style="color:${hpColor};">健康 ${c.health}</span>
            <span class="stat-sep">·</span>
            <span>宠爱 ${c.favor}</span>
            <span class="stat-sep">·</span>
            <span>预产：还剩 ${Math.max(0,10-c.pregMonth)}个月</span>
          </div>
        </div>
      </div>`;
    });
    html+='</div>';
    document.getElementById('morning-content').innerHTML=html;
    document.querySelector('#modal-morning .modal-header').textContent='有 喜 名 单';
    document.getElementById('modal-morning').classList.add('show');
  }

  // ===== 反馈弹窗 =====
  function showFeedback(html){
    document.getElementById('feedback-content').innerHTML=html;
    document.getElementById('modal-feedback').classList.add('show');
    setTimeout(()=>{document.getElementById('modal-feedback').classList.remove('show');},2500);
  }

  function closeFeedback(){
    document.getElementById('modal-feedback').classList.remove('show');
  }

  // ===== 初始化 =====
  function init(){
    try{
      load();
      updateUI();
      initStart();
      const ti=document.getElementById('title-input');
      if(ti) ti.addEventListener('input', function(){
        const c=state.concubines.find(x=>x.id===state._titleTarget);
        if(c) updateTitlePreview(c);
      });
    }catch(e){
      console.error('Init error:', e);
      // Emergency reset - clear everything
      try{localStorage.removeItem('emperor_game');}catch(e){}
      state={dynasty:'',treasury:0,year:1,month:1,actionsLeft:5,concubines:[],coldPalaceList:[],banned:{},eventLog:[],pendingEvent:null,eventTriggerRate:60,nextDraftIn:3};
      updateUI();
      initStart();
    }
  }

  // ===== 导出 =====
  function closeBanquet(){document.getElementById('modal-banquet').classList.remove('show');state._banquetSelected=null;}
  function confirmBanquet(){document.getElementById('modal-banquet').classList.remove('show');state._banquetSelected=null;save();updateUI();}
  return{init,startNewGame,confirmTreasury,nextMonth,showDetail,showPage,showColdPalace,showPregnantList,actionFavor,actionGift,actionCold,actionKill,actionColdKill,actionColdTorture,actionColdRelease,showTitleModal,closeTitleModal,confirmTitle,openRankPicker,closeRankPicker,confirmRankPicker,openBed,flipCard,endBed,rateBed,openMorning,adjustFavorMorning,closeMorning,closeBirth,showPregnancyAlert,toggleDraft,confirmDraft,confirmDraftNone,selectEventOption,confirmEventOption,handleEventOption,openPendingEvent,closeFeedback,triggerPalaceEvent,openBanquet,selectBanquetProg,submitBanquet,confirmBanquet,closeBanquet};
})();

// ===== 启动 =====
(function(){
  // Debug: verify Game is defined
  var dbg = document.getElementById('debug-status');
  if(dbg) dbg.innerHTML = 'Game type: ' + typeof Game;
  if(typeof Game === 'undefined'){
    if(dbg) dbg.innerHTML += ' | ERROR: Game not defined!';
    return;
  }
  try{
    Game.init();
    if(dbg) dbg.innerHTML += ' | Init OK';
  }catch(e){
    if(dbg) dbg.innerHTML += ' | Init Error: ' + e.message;
    alert('Game init error: ' + e.message);
  }
})();
window.onerror = function(msg, url, line, col, err){
  alert('JS Error: '+msg+'\nLine: '+line);
  return false;
};
</script>
</body>
</html>
